<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Cargo Prices</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #0f172a;
            color: white;
            padding: 10px;
        }
        h2 { text-align: center; }
        input {
            width: 100%;
            padding: 10px;
            margin-bottom: 15px;
            border-radius: 8px;
            border: 1px solid #334155;
            background: #1e293b;
            color: white;
            box-sizing: border-box;
        }
        table {
            width: 100%;
            border-collapse: collapse;
        }
        th, td {
            padding: 12px 8px;
            border-bottom: 1px solid #334155;
            text-align: left;
        }
        th {
            cursor: pointer;
            background: #1e293b;
            user-select: none;
        }
        th:hover {
            background: #334155;
        }
        .sort-icon {
            font-size: 0.8em;
            margin-left: 5px;
        }
    </style>
</head>
<body>

<h2>📦 Карго компании</h2>
<input id="search" type="text" placeholder="🔍 Поиск по названию...">

<table>
    <thead>
        <tr>
            <th>Название</th>
            <th onclick="sortByPrice()">Цена <span id="price-icon" class="sort-icon">↕</span></th>
            <th>Срок (дней)</th>
            <th>Телефон</th>
        </tr>
    </thead>
    <tbody id="table-body"></tbody>
</table>

<script>
    let cargos = [
        { name: "FAST CARGO", price: 3.1, days: "7-9", phone: "+996 555 123" },
        { name: "ASIA CARGO", price: 2.8, days: "10-14", phone: "+996 777 456" },
        { name: "TURAN EXPRESS", price: 3.5, days: "5-7", phone: "+996 700 888" },
        { name: "NOMAD LOGISTIC", price: 2.5, days: "15-20", phone: "+996 222 333" }
    ];

    let currentSortAsc = true;

    function render(data) {
        const tableBody = document.getElementById('table-body');
        tableBody.innerHTML = '';
        
        data.forEach(c => {
            const row = `
                <tr>
                    <td>**${c.name}**</td>
                    <td>${c.price}$</td>
                    <td>${c.days}</td>
                    <td>${c.phone}</td>
                </tr>
            `;
            tableBody.insertAdjacentHTML('beforeend', row);
        });
    }

    function sortByPrice() {
        currentSortAsc = !currentSortAsc;
        
        // Сортировка массива
        cargos.sort((a, b) => {
            return currentSortAsc ? a.price - b.price : b.price - a.price;
        });

        // Обновляем иконку
        const icon = document.getElementById('price-icon');
        icon.innerText = currentSortAsc ? "↑" : "↓";

        render(cargos);
    }

    // Поиск
    document.getElementById('search').addEventListener('input', e => {
        const query = e.target.value.toLowerCase();
        const filtered = cargos.filter(c =>
            c.name.toLowerCase().includes(query)
        );
        render(filtered);
    });

    // Первичная отрисовка
    render(cargos);
</script>

</body>
</html>
